# HeliOS Compliance Rules for Nomic
# Version: 2.0.2
# Date: 2025-10-25
#
# This file contains semantic analysis rules for HeliOS compliance checking.
# Rules are defined using Nomic's DSL as specified in RULES_SPEC.md

---
# Function Structure Rules

- id: HELIOS-FS-001-ENTER
  description: "Functions must start with FUNCTION_ENTER macro"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    fn.entry_statements and
    len(fn.entry_statements) > 0 and
    pattern_matches(fn.entry_statements[0], "FUNCTION_ENTER")
  exceptions:
    - "fn.name == 'main'"
    - "pattern_matches(fn.name, '^test_')"
    - "pattern_matches(fn.name, '^mock_')"
  message: >
    Function {{ fn.name }} at {{ fn.source_range.file }}:{{ fn.source_range.line_start }}
    missing FUNCTION_ENTER macro as first statement
  fixit: >
    Add 'FUNCTION_ENTER;' immediately after the opening brace of {{ fn.name }}
  tags: [structure, mandatory]

- id: HELIOS-FS-001-EXIT
  description: "Functions must end with FUNCTION_EXIT macro"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    fn.exit_statements and
    len(fn.exit_statements) > 0 and
    exists(stmt in fn.exit_statements if pattern_matches(stmt, "FUNCTION_EXIT"))
  exceptions:
    - "fn.name == 'main'"
    - "pattern_matches(fn.name, '^test_')"
    - "pattern_matches(fn.name, '^mock_')"
  message: >
    Function {{ fn.name }} at {{ fn.source_range.file }}:{{ fn.source_range.line_start }}
    missing FUNCTION_EXIT macro before return
  fixit: >
    Add 'FUNCTION_EXIT;' before the closing brace of {{ fn.name }}
  tags: [structure, mandatory]

- id: HELIOS-FS-002
  description: "No early returns except through allowed macros"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(stmt in fn.all_statements
      if pattern_matches(stmt, "\\breturn\\b") and not (
        pattern_matches(stmt, "FUNCTION_EXIT") or
        pattern_matches(stmt, "__Return")
      )
    )
  exceptions:
    - "fn.name == 'main'"
  message: >
    Function {{ fn.name }} has early return statement not using FUNCTION_EXIT or __Return* macros
  fixit: >
    Replace direct return with __ReturnOk__() or restructure to use FUNCTION_EXIT
  tags: [structure, control-flow]

- id: HELIOS-FS-003
  description: "Public API functions must return Return_t"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn.name, "^x[A-Z]")
  assert_code: >
    fn.return_type == "Return_t"
  message: >
    Public API function {{ fn.name }} should return Return_t, not {{ fn.return_type }}
  fixit: >
    Change return type of {{ fn.name }} to Return_t
  tags: [api, type-system]

- id: HELIOS-FS-004
  description: "Function complexity should not exceed maximum"
  severity: info
  scope: Function
  select: "fn: Function"
  assert_code: >
    fn.cyclomatic_complexity <= 15
  message: >
    Function {{ fn.name }} has cyclomatic complexity {{ fn.cyclomatic_complexity }} (max: 15)
  fixit: >
    Refactor {{ fn.name }} into smaller, more focused functions
  tags: [complexity, maintainability]

- id: HELIOS-FS-005
  description: "Functions should not exceed maximum lines"
  severity: info
  scope: Function
  select: "fn: Function"
  assert_code: >
    (fn.source_range.line_end - fn.source_range.line_start) <= 200
  message: >
    Function {{ fn.name }} has {{ fn.source_range.line_end - fn.source_range.line_start }} lines (max: 200)
  fixit: >
    Split {{ fn.name }} into smaller functions
  tags: [size, maintainability]

---
# Parameter Naming Rules

- id: HELIOS-PN-001
  description: "Function parameters must end with underscore"
  severity: warning
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(param in fn.parameters
      if param.ctype != "void" and not pattern_matches(param.name, "_$")
    )
  exceptions:
    - "fn.name == 'main'"
    - "'...' in [p.ctype for p in fn.parameters]"
  message: >
    Parameter(s) in {{ fn.name }} not ending with underscore:
    {{ ', '.join([p.name for p in fn.parameters if not p.name.endswith('_') and p.ctype != 'void']) }}
  fixit: >
    Add underscore suffix to all parameters in {{ fn.name }}
  tags: [naming, convention]

---
# Naming Convention Rules

- id: HELIOS-NC-001
  description: "Macros must use double underscores and ALL_CAPS"
  severity: warning
  scope: MacroDefinition
  select: "macro: MacroDefinition"
  assert_code: >
    pattern_matches(macro.name, "^__[A-Z_]+__$") or
    pattern_matches(macro.name, "^[A-Z_]+$")
  exceptions:
    - "macro.preprocessor.guard_condition == 'UNIT_TEST'"
  message: >
    Macro {{ macro.name }} should use __ALL_CAPS__ naming convention
  fixit: >
    Rename {{ macro.name }} to follow __ALL_CAPS__ pattern
  tags: [naming, macro]

- id: HELIOS-NC-002
  description: "Static functions must use double underscore prefix/suffix"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where fn.is_static
  assert_code: >
    pattern_matches(fn.name, "^__.*__$")
  message: >
    Static function {{ fn.name }} should use __Name__ format
  fixit: >
    Rename {{ fn.name }} to __{{ fn.name.strip('_') }}__
  tags: [naming, static]

- id: HELIOS-NC-003
  description: "Public API functions must start with 'x'"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where not fn.is_static and fn.linkage == "external"
  assert_code: >
    pattern_matches(fn.name, "^x[A-Z]") or
    pattern_matches(fn.name, "^__") or
    fn.name == "main"
  message: >
    Public function {{ fn.name }} should start with 'x' prefix (e.g., xSystemInit)
  fixit: >
    Rename {{ fn.name }} to start with 'x' prefix
  tags: [naming, api]

- id: HELIOS-NC-004
  description: "Type definitions should end with _t"
  severity: info
  scope: TypeDecl
  select: >
    type: TypeDecl
    where type.kind == "typedef"
  assert_code: >
    pattern_matches(type.name, "_t$")
  message: >
    Type {{ type.name }} should end with '_t' suffix
  fixit: >
    Rename {{ type.name }} to {{ type.name }}_t
  tags: [naming, type]

---
# Memory Management Rules

- id: HELIOS-MM-001
  description: "Pointer parameters must be checked for NULL"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(param in fn.parameters
      if pattern_matches(param.ctype, "\\*") and
         not exists(stmt in fn.all_statements if pattern_matches(stmt, "__Pointer.*" + param.name))
    )
  exceptions:
    - "fn.annotations and any(ann.text == 'UNCHECKED_PARAMS' for ann in fn.annotations)"
  message: >
    Pointer parameter(s) in {{ fn.name }} not checked for NULL:
    {{ ', '.join([p.name for p in fn.parameters if '*' in p.ctype]) }}
  fixit: >
    Add __PointerIsNotNull__(ptr_) checks for all pointer parameters
  tags: [memory, safety]

- id: HELIOS-MM-002
  description: "Memory allocation must be checked"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(call in fn.calls
      if pattern_matches(call.callee_name, "AllocateMemory") and
         not pattern_matches(fn, "OK\\s*\\(")
    )
  message: >
    Memory allocation in {{ fn.name }} not checked with OK() macro
  fixit: >
    Check allocation result with 'if (OK(ret))' after allocation
  tags: [memory, allocation]

- id: HELIOS-MM-003
  description: "MEMFAULT flag must be set before memory error handling"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(stmt in fn.all_statements
      if pattern_matches(stmt, "__AssertOnElse__.*memory") and
         not exists(prev_stmt in fn.all_statements if pattern_matches(prev_stmt, "__SetFlag__\\(MEMFAULT\\)"))
    )
  message: >
    Memory error in {{ fn.name }} without setting MEMFAULT flag
  fixit: >
    Add '__SetFlag__(MEMFAULT);' before memory error assertion
  tags: [memory, error-handling]

- id: HELIOS-MM-004
  description: "Allocated memory must be freed"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(call in fn.calls
      if pattern_matches(call.callee_name, "AllocateMemory") and
         not exists(free_call in fn.calls if pattern_matches(free_call.callee_name, "FreeMemory"))
    )
  exceptions:
    - "fn.annotations and any(ann.text == 'TRANSFERS_OWNERSHIP' for ann in fn.annotations)"
  message: >
    Memory allocated in {{ fn.name }} may not be freed on all paths
  fixit: >
    Ensure all allocated memory is freed before function exit
  tags: [memory, leak]

- id: HELIOS-MM-005
  description: "Check for potential null pointer dereferences"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(var in fn.local_vars
      if pattern_matches(var.ctype, "\\*") and var.writes and
         not var.is_initialized and
         not exists(stmt in fn.all_statements if pattern_matches(stmt, "__PointerIsNotNull.*" + var.name))
    )
  message: >
    Potential null pointer dereference in {{ fn.name }}
  fixit: >
    Add null check before dereferencing pointer
  tags: [memory, null-deref]

---
# Error Handling Rules

- id: HELIOS-EH-001
  description: "Error conditions should use __AssertOnElse__"
  severity: warning
  scope: IfStmt
  select: >
    ifstmt: IfStmt
    where ifstmt.else_block is not None
  assert_code: >
    not pattern_matches(ifstmt.condition, "OK\\s*\\(") or
    pattern_matches(ifstmt.else_block, "__AssertOnElse__")
  message: >
    Error path in function should use __AssertOnElse__()
  fixit: >
    Add __AssertOnElse__() in the else block
  tags: [error-handling, assertion]

- id: HELIOS-EH-002
  description: "Use OK() macro for status checks"
  severity: warning
  scope: IfStmt
  select: >
    ifstmt: IfStmt
    where pattern_matches(ifstmt.condition, "\\bret\\b")
  assert_code: >
    pattern_matches(ifstmt.condition, "OK\\s*\\(") or
    pattern_matches(ifstmt.condition, "ERROR\\s*\\(")
  message: >
    Status check should use OK() or ERROR() macro
  fixit: >
    Replace condition with 'if (OK(ret))'
  tags: [error-handling, status]

- id: HELIOS-EH-003
  description: "Variable 'ret' must not be directly accessed"
  severity: error
  scope: Function
  select: >
    fn: Function
    where exists(var in fn.local_vars if var.name == "ret")
  assert_code: >
    not exists(stmt in fn.all_statements
      if pattern_matches(stmt, "\\bret\\s*=") and
         not pattern_matches(stmt, "FUNCTION_ENTER") and
         not pattern_matches(stmt, "__ReturnOk__") and
         not pattern_matches(stmt, "__ReturnWithValue__")
    )
  message: >
    Direct access to 'ret' variable in {{ fn.name }} - use macros only
  fixit: >
    Use FUNCTION_ENTER, FUNCTION_EXIT, or __ReturnOk__() to modify 'ret'
  tags: [error-handling, ret-variable]

- id: HELIOS-EH-004
  description: "__ReturnError__() macro must not exist or be used"
  severity: error
  scope: Function
  select: "fn: Function"
  assert_code: >
    not pattern_matches(fn, "__ReturnError__")
  message: >
    __ReturnError__() is prohibited in {{ fn.name }} - errors are indicated by default ReturnError
  fixit: >
    Remove __ReturnError__() - rely on FUNCTION_ENTER's default ReturnError initialization
  tags: [error-handling, prohibited]

---
# Code Quality Rules

- id: HELIOS-CQ-001
  description: "Variables should be initialized"
  severity: info
  scope: Variable
  select: >
    var: Variable
    where var.is_local
  assert_code: >
    var.is_initialized or
    pattern_matches(var.ctype, "\\*")
  message: >
    Variable {{ var.name }} in {{ var.parent_function.name }} is not initialized at declaration
  fixit: >
    Initialize {{ var.name }} at declaration
  tags: [quality, initialization]

- id: HELIOS-CQ-002
  description: "Use descriptive cursor for linked list operations"
  severity: info
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn, "->next")
  assert_code: >
    exists(var in fn.local_vars if var.name == "cursor")
  message: >
    List traversal in {{ fn.name }} should use 'cursor' variable name
  fixit: >
    Use 'cursor' as the iterator variable name for list traversal
  tags: [quality, naming]

- id: HELIOS-CQ-003
  description: "Add comments for memory cleanup"
  severity: info
  scope: CallSite
  select: >
    call: CallSite
    where pattern_matches(call.callee_name, "Free")
  assert_code: >
    call.preprocessor and call.preprocessor.active_defines
  message: >
    Memory cleanup at line {{ call.location.line_start }} should have explanatory comment
  fixit: >
    Add comment explaining the memory cleanup operation
  tags: [quality, documentation]

---
# Concurrency Rules

- id: HELIOS-CN-001
  description: "Critical sections must disable/enable interrupts"
  severity: error
  scope: Function
  select: >
    fn: Function
    where fn.has_critical_section
  assert_code: >
    pattern_matches(fn, "__DisableInterrupts__") and
    pattern_matches(fn, "__EnableInterrupts__")
  message: >
    Critical section in {{ fn.name }} missing interrupt disable/enable
  fixit: >
    Add __DisableInterrupts__() and __EnableInterrupts__() around critical section
  tags: [concurrency, interrupt]

- id: HELIOS-CN-002
  description: "Shared data should be volatile"
  severity: warning
  scope: Variable
  select: >
    var: Variable
    where var.is_global and len(var.written_by) > 1
  assert_code: >
    var.is_volatile
  message: >
    Shared variable {{ var.name }} should be declared volatile
  fixit: >
    Add 'volatile' qualifier to {{ var.name }}
  tags: [concurrency, volatile]

---
# Type System Rules

- id: HELIOS-TS-001
  description: "Use only HeliOS types, not standard C types"
  severity: error
  scope: Variable
  select: "var: Variable"
  assert_code: >
    not pattern_matches(var.ctype, "\\b(int|short|long|char|unsigned|signed)\\b") or
    pattern_matches(var.ctype, "_t\\b") or
    var.decl_function == "main"
  exceptions:
    - "var.preprocessor.guard_condition == 'COMPATIBILITY_MODE'"
  message: >
    Variable {{ var.name }} uses standard C type {{ var.ctype }} instead of HeliOS types
  fixit: >
    Replace with HeliOS types: int→Word_t, char→Byte_t, void*→Addr_t
  tags: [type-system, helios-types]

---
# Magic Number Rules

- id: HELIOS-MN-001
  description: "Avoid magic numbers"
  severity: info
  scope: Function
  select: "fn: Function"
  assert_code: >
    not pattern_matches(fn, "(?<![x0-9a-fA-F])[2-9]\\d{2,}(?![0-9a-fA-F])")
  exceptions:
    - "pattern_matches(fn, '#define')"
  message: >
    Magic number found in {{ fn.name }} - define as named constant
  fixit: >
    Create a #define or const for numeric literals
  tags: [magic-number, maintainability]

- id: HELIOS-MN-002
  description: "Numeric literals must be in hexadecimal with type suffix"
  severity: warning
  scope: Function
  select: "fn: Function"
  assert_code: >
    not exists(stmt in fn.all_statements
      if pattern_matches(stmt, "=\\s*[0-9]") and
         not pattern_matches(stmt, "=\\s*0x[0-9a-fA-F]+[uUlL]") and
         not pattern_matches(stmt, "=\\s*[01]\\b")
    )
  message: >
    Use hexadecimal notation with type suffix in {{ fn.name }}
  fixit: >
    Convert decimal to hex with suffix: 3 → 0x3u, 256 → 0x100u
  tags: [numeric-literal, style]

---
# Cross-Function Analysis Rules

- id: HELIOS-CFA-001
  description: "Type mismatch across function boundaries"
  severity: error
  scope: CallSite
  select: >
    call: CallSite
    where call.callee_symbol is not None
  assert_code: >
    safe_getattr(call.callee_symbol, 'parameters', None) and
    len(call.args) == len(safe_getattr(call.callee_symbol, 'parameters', []))
  message: >
    Argument count mismatch in call to {{ call.callee_name }}
  fixit: >
    Ensure argument types match parameter types
  tags: [type-consistency, call-site]

- id: HELIOS-CFA-002
  description: "Race condition on global variables"
  severity: error
  scope: Variable
  select: >
    var: Variable
    where var.is_global and not var.is_const
  assert_code: >
    var.is_volatile or
    var.has_mutex_protection or
    len(var.written_by) <= 1
  message: >
    Potential race condition on global variable {{ var.name }}
  fixit: >
    Add proper synchronization or volatile qualifier
  tags: [race-condition, global]

---
# State Machine Rules

- id: HELIOS-SM-001
  description: "Task state transitions must be valid"
  severity: error
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn.name, "xTask")
  assert_code: >
    not pattern_matches(fn, "RUNNING.*WAITING.*RUNNING")
  message: >
    Invalid task state transition in {{ fn.name }}
  fixit: >
    Ensure state transitions follow valid state machine rules
  tags: [state-machine, task]

- id: HELIOS-SM-002
  description: "Scheduler functions must check scheduler state"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn.name, "Scheduler")
  assert_code: >
    pattern_matches(fn, "__FlagIsSet__\\(RUNNING\\)")
  message: >
    {{ fn.name }} should verify scheduler state before operation
  fixit: >
    Add scheduler state verification using __FlagIsSet__(RUNNING)
  tags: [scheduler, state]

---
# Safety Rules

- id: HELIOS-SF-001
  description: "Buffer overflow checks required"
  severity: error
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn, "memcpy|strcpy|strcat")
  assert_code: >
    pattern_matches(fn, "__SetFlag__\\(OVERFLOW\\)") or
    pattern_matches(fn, "bounds.*check")
  message: >
    Missing overflow check in {{ fn.name }}
  fixit: >
    Add bounds checking before buffer operations
  tags: [safety, overflow]

- id: HELIOS-SF-002
  description: "Validate input parameters"
  severity: error
  scope: Function
  select: >
    fn: Function
    where fn.is_api
  assert_code: >
    exists(stmt in fn.entry_statements
      if pattern_matches(stmt, "__Validate|__PointerIs")
    )
  message: >
    Input validation missing in API function {{ fn.name }}
  fixit: >
    Validate input parameters at function entry
  tags: [safety, validation]

---
# Cross-Reference Rules

- id: HELIOS-XREF-001
  description: "Function is never called"
  severity: info
  scope: Function
  select: >
    fn: Function
    where not fn.is_static
  assert_code: >
    len(fn.called_by) > 0 or
    fn.name == "main" or
    pattern_matches(fn.name, "^__.*interrupt")
  message: >
    Function {{ fn.name }} appears to be unused
  fixit: >
    Remove if unused or add appropriate calls
  tags: [dead-code, unused]

- id: HELIOS-XREF-002
  description: "Public function not declared in header"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where not fn.is_static and fn.linkage == "external"
  assert_code: >
    fn.annotations or fn.name == "main"
  message: >
    Public function {{ fn.name }} may be missing header declaration
  fixit: >
    Add declaration to appropriate header file
  tags: [header, declaration]

---
# File-Level Rules

- id: HELIOS-FILE-001
  description: "Header files must have include guards"
  severity: warning
  scope: TranslationUnit
  select: >
    tu: TranslationUnit
    where pattern_matches(tu.path, "\\.h$")
  assert_code: >
    exists(macro in tu.macros
      if pattern_matches(macro.name, "_H$|_H_$")
    )
  message: >
    Header file {{ tu.path }} missing include guards
  fixit: >
    Add #ifndef/#define/#endif guards
  tags: [header, guard]

- id: HELIOS-FILE-002
  description: "Files should not exceed maximum lines"
  severity: info
  scope: TranslationUnit
  select: "tu: TranslationUnit"
  assert_code: >
    len(tu.functions) < 50
  message: >
    File {{ tu.path }} is too large ({{ len(tu.functions) }} functions)
  fixit: >
    Consider splitting file into smaller modules
  tags: [file-size, modularity]

---
# Documentation Rules

- id: HELIOS-DC-001
  description: "Functions should have documentation header"
  severity: info
  scope: Function
  select: >
    fn: Function
    where fn.is_api
  assert_code: >
    fn.annotations is not None and len(fn.annotations) > 0
  message: >
    API function {{ fn.name }} lacks documentation
  fixit: >
    Add documentation header with @brief, @param, @return
  tags: [documentation, api]

- id: HELIOS-DC-002
  description: "Complex logic should have explanatory comments"
  severity: info
  scope: Function
  select: >
    fn: Function
    where fn.cyclomatic_complexity > 10
  assert_code: >
    len(fn.annotations) > 3
  message: >
    Complex function {{ fn.name }} needs more explanatory comments
  fixit: >
    Add comments to explain complex logic sections
  tags: [documentation, complexity]

---
# Composite Rules

- id: HELIOS-COMP-001
  description: "Complete memory safety compliance"
  severity: error
  scope: Function
  select: >
    fn: Function
    where len(fn.calls) > 0
  assert_code: >
    (not exists(call in fn.calls
      if pattern_matches(call.callee_name, "Allocate") and
         not pattern_matches(fn, "OK\\s*\\(")
    )) and
    (not exists(param in fn.parameters
      if pattern_matches(param.ctype, "\\*") and
         not pattern_matches(fn, "__PointerIs")
    ))
  message: >
    Function {{ fn.name }} must satisfy all memory safety rules
  fixit: >
    Ensure all memory operations are properly checked
  tags: [composite, memory-safety]

- id: HELIOS-COMP-002
  description: "Complete function structure compliance"
  severity: error
  scope: Function
  select: >
    fn: Function
    where fn.return_type == "Return_t"
  assert_code: >
    pattern_matches(fn.entry_statements[0] if fn.entry_statements else "", "FUNCTION_ENTER") and
    exists(stmt in fn.exit_statements if pattern_matches(stmt, "FUNCTION_EXIT"))
  exceptions:
    - "fn.name == 'main'"
  message: >
    Function {{ fn.name }} must have proper ENTER/EXIT structure
  fixit: >
    Add FUNCTION_ENTER and FUNCTION_EXIT macros
  tags: [composite, structure]

- id: HELIOS-COMP-003
  description: "Complete API compliance for public functions"
  severity: warning
  scope: Function
  select: >
    fn: Function
    where pattern_matches(fn.name, "^x[A-Z]")
  assert_code: >
    fn.return_type == "Return_t" and
    (not exists(param in fn.parameters
      if param.ctype != "void" and not pattern_matches(param.name, "_$")
    )) and
    fn.annotations is not None
  message: >
    Public API function {{ fn.name }} must meet all API requirements
  fixit: >
    Ensure Return_t return type, parameter naming, and documentation
  tags: [composite, api]